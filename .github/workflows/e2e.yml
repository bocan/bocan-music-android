name: End-to-end (nightly)

# Phase 17: the full end-to-end suite (journeys, tag audits, surface crawls) on an API 36
# emulator. Nightly and on demand only; it is never a required pull request check. The repo
# is public, so ubuntu-latest has KVM. No secrets: the built-in GITHUB_TOKEN opens the issue.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # run.sh finds the booted emulator as the attached device, so this is exactly what
      # `make end-to-end` does on a development Mac.
      - name: Run the end-to-end suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: make end-to-end

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: build/e2e/
          if-no-files-found: warn

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary="$(cat build/e2e/summary.txt 2>/dev/null || echo 'no summary: the run stopped before the tests')"
          gh issue create \
            --title "Nightly end-to-end failed ($(date -u +%Y-%m-%d))" \
            --body "$(printf '%s\n\nRun and artifacts (screenshots, JUnit XML, HTML report): %s\n' "$summary" "$RUN_URL")"
